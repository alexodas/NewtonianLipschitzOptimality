    "description": "Research in progress: Lean 4 verification of sharp Cartesian-supremum-norm Newtonian point-source sensitivity. Verified results include exact scalar C3 (R016–R017), derivative upper bound and pointwise minimality (R024–R032), convex/Cartesian-box finite differences (R030–R031), an attaining outward-safe ray (R033–R034), distinct admissible secant pairs (R035), the exact admissible right-hand finite-difference limit (R036), the necessary universal two-point lower bound for the unit source (R037), the nonconvex bound for safe long separations (R038), and the nonconvex bound for endpoints with a common supporting safe halfspace (R039). R040 constructs two convex-safe coordinate hops for endpoints with different safe active axes and proves a nonsharp 2*C3 two-point estimate. The sharp global nonconvex C3 upper bound for short cross-face pairs and the complete N-source theorem remain unproved. Prospective areas: rigorous dynamics, validated dynamics, interval arithmetic, Barnes–Hut/FMM astrophysics, Coulomb modeling, AMR, GPU/HPC, planetary-defense uncertainty propagation, space situational awareness and certified Cartesian N-body methods. No performance or Palomar submission claims.",
