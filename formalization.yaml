    "description": "Research in progress: Lean 4 verification of the Cartesian-supremum-norm sensitivity coefficient C3 for the exact three-dimensional Newtonian point-source field. The exact scalar maximum (R016–R017), pointwise derivative-norm bound and sharp witness (R027–R029), and finite-difference inequality on convex safe domains (R030) are Lean-verified. A Cartesian-box clearance corollary is proposed, awaiting CI. The global two-point inequality for arbitrary safe endpoints outside nonconvex forbidden cubes, and its optimality, remain unproved. Prospective applications include rigorous dynamics, interval arithmetic, computational astrophysics (Barnes–Hut/FMM), Coulomb simulation, adaptive mesh refinement, GPU/HPC, planetary-defense uncertainty propagation, space situational awareness and certified Cartesian N-body methods. No measured performance improvement or Palomar submission is claimed.",
