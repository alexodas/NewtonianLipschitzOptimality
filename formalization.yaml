    "description": "Research in progress: Lean 4 verification of sharp Cartesian-supremum-norm Newtonian point-source sensitivity. Verified results include exact scalar C3 (R016–R017), derivative upper bound and pointwise minimality (R024–R032), convex/Cartesian-box finite differences (R030–R031), an attaining outward-safe ray (R033–R034), distinct admissible secant pairs (R035), the exact admissible right-hand finite-difference limit (R036), the necessary universal two-point lower bound for the unit source (R037), the nonconvex bound for safe long separations (R038), and the nonconvex bound for endpoints with a common supporting safe halfspace (R039). R040 constructs two convex-safe coordinate hops for endpoints with different safe active axes and proves a nonsharp 2*C3 two-point estimate. R041 proves the conditional exact N-source coefficient N*M*C3/d^3 from the still-unproved one-source global C3 proposition. R042 proves exact tangential scalar denominator and row-numerator inequalities supporting a prospective 5/4 safe-plane derivative bound, together with the strict comparison C3>5/2. R043 proves the exact conditional implication from the explicitly unproved safe-plane 5/4 finite-difference proposition oneSourceSafePlaneFiveFourthBound to the one-source global sharp C3 proposition oneSourceGlobalCandidateBound, using an exhaustive safe-axis geometric case split and C3>5/2. R044 proves a 5/4 restriction of the ACTUAL physical Newtonian Jacobian and Frechet directional derivative at normalized nonnegative points (1,u,v), h_0=0, using R042's scalar certificates. R045 extends the real physical Jacobian 5/4 tangential directional derivative to arbitrary signed points satisfying d<=|x_0|, d>0, with factor μ/d³, using sign invariance and inverse-cube scaling. R046 proves the true physical 5/4 tangential derivative inequality on every signed-safe Cartesian axis, for arbitrary positive clearance d, by exact cyclic permutation of the verified physical Newtonian Jacobian. The safe-plane finite-difference estimate, unconditional sharp global C3 upper bound and complete N-source theorem remain unproved. Prospective areas: rigorous dynamics, validated dynamics, interval arithmetic, Barnes–Hut/FMM astrophysics, Coulomb modeling, AMR, GPU/HPC, planetary-defense uncertainty propagation, space situational awareness and certified Cartesian N-body methods. No performance or Palomar submission claims.",
