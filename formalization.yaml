    "name": "Sharp Cartesian Lipschitz bounds for three-dimensional Newtonian point-source fields",
    "description": "For the three-dimensional Newtonian inverse-square field, we determine the exact sharp Cartesian Lipschitz coefficient C3. It is the global maximum on [0,1] of f(t)=(2+6t-2t^2)/(1+2t^2)^(5/2), attained at the unique root t* in [9/50,1/5] of 2t^3-8t^2-4t+1=0. For any finite set of point sources with arbitrary centers a_i, masses 0<=m_i<=M, G>=0 and Cartesian clearance d>0 at both observation points P,Q, the exact Newtonian acceleration g satisfies ||g(P)-g(Q)||_infinity <= (n G M C3/d^3)||P-Q||_infinity. The segment from P to Q need not remain outside the excluded cubes. The coefficient is optimal universally across configurations: for the unit source at the origin it is the least constant controlling all safe pairs. Euclidean radii occur in the physical force law; clearance and force differences use the Cartesian supremum norm.",
