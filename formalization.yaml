    "name": "Sharp Cartesian Lipschitz bounds for three-dimensional Newtonian point-source fields",
    "description": "Two Lean-verified mathematical results. First, the unique root t of 2t^3-8t^2-4t+1=0 in [9/50,1/5] gives the exact maximum C3=(2+6t-2t^2)/(1+2t^2)^(5/2) of the scalar coefficient on [0,1]. Second, for any finite collection of nonnegative point masses at arbitrary centers in R^3, with gravitational parameter G>=0, uniform mass cap M>=0, and Cartesian clearance d>0 at two observation points from every source, the difference of their exact Newtonian gravitational accelerations is bounded in the Cartesian supremum norm by (N*G*M*C3/d^3) times their separation. No condition on the connecting segment is imposed: it may enter the excluded open safety cubes. The coefficient is the least possible universal coefficient over these configurations, already witnessed by the unit single-source case. The force law itself uses Euclidean radial distances. The statements and proofs are presented in standalone Challenge and Solution modules for Comparator; external review and Palomar registration are separate.",
